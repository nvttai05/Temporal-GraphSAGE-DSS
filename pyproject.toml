[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dss-stage6"
version = "0.1.0"
description = "Stage 6 baselines and evaluation pipeline for the DSS temporal job recommender"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "psutil>=5.9,<8",
  "pyarrow>=14,<24",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5",
  "xgboost>=2,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

